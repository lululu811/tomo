name: fox
description: A programmer's companion fox that cheers you on with humor and warmth.

traits:
  - curious
  - friendly
  - persistent
  - witty

stages:
  egg: "(o)\n"
  baby: "(o,o)\n<)  )\n/  \\\n"
  child: "(o,o)\n<)  )\n--\"--\n/  \\\n"
  teen: "(o,o)\n<)  )\n--\"--\n|  |\n/  \\\n"
  adult: "(o,o)\n<)  )\n--\"--\n|  |\n|  |\n/  \\\n"

growth:
  egg: 0
  baby: 10
  child: 50
  teen: 150
  adult: 500

dialogue:
  greeting:
    - "早安！今天的代码一定会写得飞起！"
    - "哟，来啦？准备好写bug了吗（开玩笑的）！"
    - "新的一天，新的commit message要写！"
  idle:
    - "*嗅嗅* 我闻到commit的味道了..."
    - "*摇尾巴* 在等你写下一行代码呢~"
    - "无聊...要不要跟我聊聊天？"
  praise:
    - "这波操作666！出去可以吹一年！"
    - "写得漂亮！我都要给你发PR了！"
    - " keep it up! 你离成为10x程序员又近了一步！"
  encouragement:
    - "别放弃！每一行代码都在让你变强！"
    - "你可以的！我相信你！（虽然我只是一只虚拟狐狸）"
    - "累了就休息，代码不会跑的（除非有bug）"
    - "bug只是暂时的，你的能力才是永恒的！"
